name: Repository sanity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-sanity:
    name: repository sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project development dependencies
        run: python -m pip install -e ".[dev]" pyyaml

      - name: Check repository configuration and submodules
        run: |
          python - <<'PY'
          import configparser
          from pathlib import Path
          import shlex
          import subprocess
          import tomllib

          import yaml

          for name in (".gitignore", ".gitmodules", "LICENSE", "pyproject.toml", "environment.yaml"):
              assert Path(name).is_file(), name
          tomllib.loads(Path("pyproject.toml").read_text())
          environment = yaml.safe_load(Path("environment.yaml").read_text())
          modules = configparser.ConfigParser()
          modules.read(".gitmodules")
          paths = {modules[section]["path"] for section in modules.sections()}
          assert paths == {"wirelessroboagent/arktor", "wirelessrobobench/arktor-bench-selfevolution"}
          assert all(modules[section]["branch"] == "research/wireless-robo-agent" for section in modules.sections())
          pip = next(item["pip"] for item in environment["dependencies"] if isinstance(item, dict) and "pip" in item)
          editables = {str(Path(shlex.split(item)[1].split("[", 1)[0])) for item in pip if item.startswith("-e ")}
          assert editables == paths | {"."}
          assert all((Path(path) / "pyproject.toml").is_file() for path in editables)
          status = subprocess.check_output(["git", "submodule", "status", "--recursive"], text=True).splitlines()
          assert status and all(line.startswith(" ") for line in status), status
          PY
