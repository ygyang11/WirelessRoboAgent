name: Repository sanity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-sanity:
    name: repository sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project development dependencies
        run: python -m pip install -e ".[dev]" pyyaml

      - name: Check repository
        run: python .github/scripts/check_repository.py
